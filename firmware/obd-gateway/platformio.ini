; ESP32-S3 N16R8 OBD gateway for ewd-volvo.ru
[env:esp32-s3-n16r8-mcp2515]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DOBD_CAN_BACKEND_MCP2515=1
  -DCORE_DEBUG_LEVEL=1
lib_deps =
  autowp/mcp_can@^1.5.1
  bblanchon/ArduinoJson@^7.2.1
monitor_speed = 115200

; Recommended: native TWAI + SN65HVD230
[env:esp32-s3-n16r8-twai]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DOBD_CAN_BACKEND_TWAI=1
  -DCORE_DEBUG_LEVEL=1
lib_deps =
  bblanchon/ArduinoJson@^7.2.1
monitor_speed = 115200

