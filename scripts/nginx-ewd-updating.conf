# Snippet for the ewd-volvo.ru server block (nginx).
# Serves a branded page while the Docker app is down (deploy → 502/503/504).
#
# After git pull, file exists at:
#   /opt/ewd-app/client/public/updating.html
#
# One-time setup:
#   1. Paste these directives into the HTTPS server { } that proxies to :3000
#      (usually inside the location / { proxy_pass ... } area, or at server level).
#   2. nginx -t && systemctl reload nginx
#
# Test:
#   docker stop volvo-xc70-wiring
#   curl -sI https://ewd-volvo.ru/ | head
#   # expect updating page body / 502 with HTML
#   docker start volvo-xc70-wiring

# Intercept upstream errors from proxy_pass (put next to your existing proxy_*):
proxy_intercept_errors on;
error_page 502 503 504 /updating.html;

location = /updating.html {
    root /opt/ewd-app/client/public;
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "no-store";
}
